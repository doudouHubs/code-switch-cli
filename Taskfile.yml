version: '3'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

vars:
  APP_NAME: "CodeSwitch"
  BIN_DIR: "bin"
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'

tasks:
  build:
    summary: Builds a production release of the application
    cmds:
      # 根任务统一走生产构建，避免每次发布时漏传 PRODUCTION=true。
      - task: "{{OS}}:build"
        vars:
          PRODUCTION: "true"

  build-pet:
    summary: Builds the standalone pet executable for production
    cmds:
      # 宠物生产构建复用独立入口，确保前端资源、宠物资源和进程退出处理保持一致。
      - task: common:pet:build
        vars:
          PRODUCTION: "true"
      # 不同平台的 shell 输出语法不同，分别打印规范化后的最终目录，避免用户再猜产物位置。
      - cmd: >-
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command
          '& { Write-Host ("Pet build directory: " + [System.IO.Path]::GetFullPath("{{.ROOT_DIR}}/bin/pet")) }'
        platforms: [windows]
      - cmd: >-
          printf 'Pet build directory: %s\n' '{{.ROOT_DIR}}/bin/pet'
        platforms: [linux, darwin]

  publish:
    summary: Builds the current platform and pushes the release tag
    preconditions:
      - sh: git diff --quiet
        msg: Working tree has unstaged changes; commit or stash them before publishing.
      - sh: git diff --cached --quiet
        msg: Index has staged changes; commit or unstage them before publishing.
    cmds:
      - task: build
      # AppVersion 是发布版本的唯一入口；脚本会创建同名 tag，推送后触发 GitHub Actions。
      - go run ./scripts/publish.go

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{OS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{OS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

