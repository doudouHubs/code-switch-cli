name: Pet Release

on:
  push:
    tags:
      - 'pet-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pet:
    name: Build standalone pet (Windows amd64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        shell: pwsh
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.38

      - name: Install frontend dependencies
        working-directory: frontend
        shell: pwsh
        run: npm ci

      - name: Build and package standalone pet
        shell: pwsh
        env:
          ARCH: amd64
          PRODUCTION: 'true'
        run: wails3 task -dir build/pet package

      - name: Verify release archive
        shell: pwsh
        run: |
          $archive = Join-Path $PWD 'bin/CodeSwitchPet-windows-amd64.zip'
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
            throw "Release archive not found: $archive"
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($archive)
          try {
            # .NET 在 Windows 上可能用反斜杠写入 ZIP 条目，校验前统一路径分隔符。
            $entries = @($zip.Entries | ForEach-Object { $_.FullName.Replace([char]92, '/').TrimEnd('/') })
            foreach ($required in @('CodeSwitchPet.exe', 'frontend/dist/index.html')) {
              if ($entries -notcontains $required) {
                throw "Release archive is missing: $required"
              }
            }
            if (-not (@($entries | Where-Object { $_ -like 'resources/pets/*' }).Count -gt 0)) {
              throw 'Release archive is missing resources/pets entries'
            }
          } finally {
            $zip.Dispose()
          }
          Get-Item -LiteralPath $archive | Format-List FullName,Length,LastWriteTime

      - name: Upload standalone pet artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeSwitchPet-windows-amd64
          path: bin/CodeSwitchPet-windows-amd64.zip
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/pet-v')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/CodeSwitchPet-windows-amd64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
